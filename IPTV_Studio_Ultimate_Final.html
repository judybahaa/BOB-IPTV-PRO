<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic IPTV Studio Ultimate | AI-Powered Streaming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>
    <style>
        :root {
            --primary: #ff6a00;
            --primary-dark: #e55e00;
            --secondary: #00a0ff;
            --accent-purple: #9c27b0;
            --accent-teal: #00bcd4;
            --accent-gold: #ffd700;
            --accent-pink: #ff1493;
            --dark-bg: #0a0a16;
            --card-bg: #151528;
            --card-hover: #1d1d35;
            --text-primary: #ffffff;
            --text-secondary: #a8a8c8;
            --success: #00c853;
            --warning: #ffab00;
            --danger: #ff1744;
            --border-radius: 20px;
            --box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            --transition: all 0.45s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', system-ui, sans-serif;
            background: linear-gradient(145deg, var(--dark-bg), #070712, #0d0a1a);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            padding: 15px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 30% 30%, rgba(255, 106, 0, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 70% 70%, rgba(0, 160, 255, 0.07) 0%, transparent 40%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            position: relative;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .logo-icon {
            font-size: 4rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: pulse-logo 3s infinite;
        }

        .logo-text {
            font-size: 3.5rem;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(45deg, var(--primary), var(--secondary), #fff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 3px;
            position: relative;
        }

        .logo-badge {
            position: absolute;
            top: -15px;
            right: -60px;
            background: linear-gradient(135deg, var(--accent-gold), #ffed4e);
            color: #000;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.6);
            animation: badge-pulse 2s infinite;
        }

        @keyframes badge-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @keyframes pulse-logo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            font-size: 1.4rem;
            color: var(--text-secondary);
            margin-bottom: 25px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: var(--box-shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 106, 0, 0.2);
        }

        .card-title {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .badge {
            background: linear-gradient(135deg, var(--accent-purple), #6a1b9a);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Video Player */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .video-wrapper:hover .video-overlay {
            opacity: 1;
        }

        /* Channel Scanner */
        .scanner-panel {
            background: linear-gradient(135deg, rgba(0, 200, 83, 0.15), rgba(0, 160, 255, 0.15));
            border: 2px solid rgba(0, 200, 83, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .scanner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .scanner-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .scanner-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 6px 20px rgba(255, 106, 0, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 106, 0, 0.6);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #00a13f);
            color: white;
            box-shadow: 0 6px 20px rgba(0, 200, 83, 0.4);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 200, 83, 0.6);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #c41c3b);
            color: white;
            box-shadow: 0 6px 20px rgba(255, 23, 68, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 23, 68, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .scanner-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .scanner-stat {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .scanner-stat-value {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(45deg, var(--success), var(--accent-teal));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .scanner-stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .scanner-progress {
            margin-top: 15px;
            display: none;
        }

        .scanner-progress.active {
            display: block;
        }

        .progress-bar-container {
            background: rgba(0, 0, 0, 0.3);
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--accent-teal));
            width: 0%;
            transition: width 0.3s;
            position: relative;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Channel View Modes */
        .view-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .view-toggle {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px;
            border-radius: 12px;
        }

        .view-btn {
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 1.1rem;
        }

        .view-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 106, 0, 0.4);
        }

        .view-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Grid View */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .channel-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .channel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        .channel-card:hover::before {
            transform: scaleX(1);
        }

        .channel-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 106, 0, 0.3);
        }

        .channel-card.active {
            background: linear-gradient(135deg, rgba(255, 106, 0, 0.2), rgba(0, 160, 255, 0.2));
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(255, 106, 0, 0.5);
        }

        .channel-card.checking {
            opacity: 0.6;
            pointer-events: none;
        }

        .channel-card.working {
            border-color: var(--success);
        }

        .channel-card.broken {
            border-color: var(--danger);
            opacity: 0.5;
        }

        .channel-thumbnail {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, rgba(255, 106, 0, 0.1), rgba(0, 160, 255, 0.1));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 3rem;
            color: var(--primary);
        }

        .channel-info-grid {
            margin-top: 12px;
        }

        .channel-name-grid {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .channel-meta-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .meta-tag {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-badge.online {
            background: var(--success);
            color: white;
        }

        .status-badge.offline {
            background: var(--danger);
            color: white;
        }

        .status-badge.checking {
            background: var(--warning);
            color: #000;
        }

        .channel-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .action-icon-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .action-icon-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }

        .action-icon-btn.delete:hover {
            background: var(--danger);
        }

        /* List View */
        .channels-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .channel-item-list {
            background: rgba(255, 255, 255, 0.03);
            padding: 18px;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .channel-item-list:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .channel-item-list.active {
            background: linear-gradient(90deg, rgba(255, 106, 0, 0.2), rgba(0, 160, 255, 0.2));
            border-color: var(--primary);
        }

        .channel-icon-list {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(255, 106, 0, 0.2), rgba(0, 160, 255, 0.2));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }

        .channel-details-list {
            flex: 1;
        }

        .channel-name-list {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .channel-meta-list {
            display: flex;
            gap: 15px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .channel-url-list {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 5px;
            opacity: 0.7;
        }

        /* Input Section */
        .input-section {
            margin-bottom: 25px;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .input-field {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(255, 106, 0, 0.2);
        }

        .input-field::placeholder {
            color: var(--text-secondary);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--primary);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Status Indicator */
        .status-toast {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--card-bg);
            padding: 18px 35px;
            border-radius: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            backdrop-filter: blur(20px);
        }

        .status-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .status-toast.success {
            border-color: var(--success);
            box-shadow: 0 0 30px rgba(0, 200, 83, 0.5);
        }

        .status-toast.error {
            border-color: var(--danger);
            box-shadow: 0 0 30px rgba(255, 23, 68, 0.5);
        }

        .status-toast.warning {
            border-color: var(--warning);
            box-shadow: 0 0 30px rgba(255, 171, 0, 0.5);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid, .scanner-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .logo-text {
                font-size: 2.5rem;
            }

            .card-title {
                font-size: 1.5rem;
            }

            .input-group {
                grid-template-columns: 1fr;
            }

            .scanner-actions {
                flex-direction: column;
            }

            .view-controls {
                flex-direction: column;
                gap: 15px;
            }

            .channels-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Animations */
        @keyframes scan-pulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(0, 200, 83, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(0, 200, 83, 0.7);
            }
        }

        .scanning {
            animation: scan-pulse 2s infinite;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(255, 106, 0, 0.3);
            animation: modal-appear 0.4s ease-out;
        }

        @keyframes modal-appear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .modal-body {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-satellite-dish logo-icon"></i>
                <div style="position: relative;">
                    <h1 class="logo-text">MAGIC IPTV</h1>
                    <span class="logo-badge">ULTIMATE</span>
                </div>
            </div>
            <p class="subtitle">
                🚀 Next-Gen Streaming | 🔍 Smart Scanner | 🎯 AI Powered
            </p>
        </header>

        <div class="main-grid">
            <!-- Left Column -->
            <div>
                <!-- Channel Scanner Panel -->
                <div class="card">
                    <div class="scanner-panel">
                        <div class="scanner-header">
                            <div class="scanner-title">
                                <i class="fas fa-radar"></i>
                                Channel Scanner
                            </div>
                            <div class="scanner-actions">
                                <button class="btn btn-success" id="scanBtn">
                                    <i class="fas fa-play"></i>
                                    Start Scan
                                </button>
                                <button class="btn btn-danger" id="cleanBtn">
                                    <i class="fas fa-trash"></i>
                                    Remove Broken
                                </button>
                            </div>
                        </div>

                        <div class="scanner-stats">
                            <div class="scanner-stat">
                                <div class="scanner-stat-value" id="totalChannels">0</div>
                                <div class="scanner-stat-label">Total</div>
                            </div>
                            <div class="scanner-stat">
                                <div class="scanner-stat-value" id="workingChannels">0</div>
                                <div class="scanner-stat-label">Working</div>
                            </div>
                            <div class="scanner-stat">
                                <div class="scanner-stat-value" id="brokenChannels">0</div>
                                <div class="scanner-stat-label">Broken</div>
                            </div>
                            <div class="scanner-stat">
                                <div class="scanner-stat-value" id="scanProgress">0%</div>
                                <div class="scanner-stat-label">Progress</div>
                            </div>
                        </div>

                        <div class="scanner-progress" id="scannerProgress">
                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" id="progressBarFill"></div>
                            </div>
                            <div class="progress-text" id="progressText">
                                Initializing scan...
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Channel Management -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fas fa-layer-group"></i>
                            Channel Manager
                        </div>
                        <div class="badge">
                            <i class="fas fa-brain"></i>
                            Smart
                        </div>
                    </div>

                    <div class="input-section">
                        <div class="input-group">
                            <input type="text" class="input-field" id="channelName" placeholder="Channel Name">
                            <input type="text" class="input-field" id="channelGroup" placeholder="Group">
                        </div>
                        <div class="input-group">
                            <input type="text" class="input-field" id="streamUrl" placeholder="Stream URL">
                            <button class="btn btn-primary" id="addBtn">
                                <i class="fas fa-plus"></i>
                                Add Channel
                            </button>
                        </div>
                        <div class="input-group">
                            <input type="file" class="input-field" id="fileInput" accept=".m3u,.m3u8">
                            <button class="btn btn-secondary" id="importBtn">
                                <i class="fas fa-file-import"></i>
                                Import M3U
                            </button>
                        </div>
                    </div>

                    <div class="view-controls">
                        <div>
                            <span style="color: var(--text-secondary); margin-right: 15px;">
                                <i class="fas fa-tv"></i> <span id="channelCount">0</span> Channels
                            </span>
                        </div>
                        <div class="view-toggle">
                            <button class="view-btn active" id="gridViewBtn" title="Grid View">
                                <i class="fas fa-th"></i>
                            </button>
                            <button class="view-btn" id="listViewBtn" title="List View">
                                <i class="fas fa-list"></i>
                            </button>
                        </div>
                    </div>

                    <div id="channelsContainer" style="max-height: 600px; overflow-y: auto;">
                        <!-- Channels will be rendered here -->
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div>
                <!-- Video Player -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fas fa-play-circle"></i>
                            Player
                        </div>
                    </div>

                    <div class="video-wrapper">
                        <video id="videoPlayer" controls></video>
                        <div class="video-overlay"></div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">
                                <i class="fas fa-signal"></i>
                                Status
                            </div>
                            <div class="stat-value" style="font-size: 1.2rem;" id="streamStatus">Ready</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">
                                <i class="fas fa-tachometer-alt"></i>
                                Bitrate
                            </div>
                            <div class="stat-value"><span id="bitrate">0</span> Mbps</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">
                                <i class="fas fa-wifi"></i>
                                Latency
                            </div>
                            <div class="stat-value"><span id="latency">0</span> ms</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">
                                <i class="fas fa-video"></i>
                                Quality
                            </div>
                            <div class="stat-value" style="font-size: 1.2rem;" id="quality">HD</div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button class="btn btn-primary" id="downloadM3u" style="flex: 1;">
                            <i class="fas fa-download"></i>
                            .m3u
                        </button>
                        <button class="btn btn-primary" id="downloadM3u8" style="flex: 1;">
                            <i class="fas fa-download"></i>
                            .m3u8
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Toast -->
    <div class="status-toast" id="statusToast">
        <i class="fas fa-check-circle"></i>
        <span id="statusText">Ready</span>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Confirm Action</div>
            <div class="modal-body" id="modalBody">
                Are you sure you want to proceed?
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="modalCancel">Cancel</button>
                <button class="btn btn-danger" id="modalConfirm">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // State Management
        const state = {
            channels: [],
            currentChannel: -1,
            viewMode: 'grid',
            scanning: false,
            channelStatus: {},
            hls: null
        };

        // DOM Elements
        const elements = {
            channelsContainer: document.getElementById('channelsContainer'),
            channelCount: document.getElementById('channelCount'),
            totalChannels: document.getElementById('totalChannels'),
            workingChannels: document.getElementById('workingChannels'),
            brokenChannels: document.getElementById('brokenChannels'),
            scanProgress: document.getElementById('scanProgress'),
            scannerProgress: document.getElementById('scannerProgress'),
            progressBarFill: document.getElementById('progressBarFill'),
            progressText: document.getElementById('progressText'),
            videoPlayer: document.getElementById('videoPlayer'),
            streamStatus: document.getElementById('streamStatus'),
            bitrate: document.getElementById('bitrate'),
            latency: document.getElementById('latency'),
            quality: document.getElementById('quality'),
            statusToast: document.getElementById('statusToast'),
            statusText: document.getElementById('statusText'),
            confirmModal: document.getElementById('confirmModal')
        };

        // Show Toast Message
        function showToast(message, type = 'success') {
            elements.statusText.textContent = message;
            elements.statusToast.className = `status-toast show ${type}`;
            
            setTimeout(() => {
                elements.statusToast.classList.remove('show');
            }, 3500);
        }

        // Add Channel
        document.getElementById('addBtn').addEventListener('click', () => {
            const name = document.getElementById('channelName').value.trim();
            const group = document.getElementById('channelGroup').value.trim() || 'General';
            const url = document.getElementById('streamUrl').value.trim();

            if (!name || !url) {
                showToast('Please enter channel name and URL', 'error');
                return;
            }

            state.channels.push({
                name,
                group,
                url,
                id: Date.now()
            });

            document.getElementById('channelName').value = '';
            document.getElementById('channelGroup').value = '';
            document.getElementById('streamUrl').value = '';

            renderChannels();
            updateStats();
            showToast(`✅ "${name}" added successfully!`, 'success');
        });

        // Import M3U
        document.getElementById('importBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                parseM3U(e.target.result);
                showToast(`📥 Imported ${state.channels.length} channels`, 'success');
            };
            reader.readAsText(file);
        });

        // Parse M3U
        function parseM3U(content) {
            const lines = content.split('\n');
            let currentChannel = null;

            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('#EXTM3U')) continue;

                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,(.+)$/);
                    currentChannel = {
                        name: nameMatch ? nameMatch[1].trim() : 'Untitled',
                        group: 'General',
                        url: '',
                        id: Date.now() + Math.random()
                    };

                    if (line.includes('group-title="')) {
                        const groupMatch = line.match(/group-title="([^"]*)"/);
                        if (groupMatch) currentChannel.group = groupMatch[1];
                    }
                } else if (line.startsWith('http') && currentChannel) {
                    currentChannel.url = line;
                    state.channels.push(currentChannel);
                    currentChannel = null;
                }
            }

            renderChannels();
            updateStats();
        }

        // View Mode Toggle
        document.getElementById('gridViewBtn').addEventListener('click', () => {
            state.viewMode = 'grid';
            document.getElementById('gridViewBtn').classList.add('active');
            document.getElementById('listViewBtn').classList.remove('active');
            renderChannels();
        });

        document.getElementById('listViewBtn').addEventListener('click', () => {
            state.viewMode = 'list';
            document.getElementById('listViewBtn').classList.add('active');
            document.getElementById('gridViewBtn').classList.remove('active');
            renderChannels();
        });

        // Render Channels
        function renderChannels() {
            elements.channelCount.textContent = state.channels.length;

            if (state.channels.length === 0) {
                elements.channelsContainer.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary);">No channels added yet</div>';
                return;
            }

            if (state.viewMode === 'grid') {
                renderGridView();
            } else {
                renderListView();
            }
        }

        // Grid View
        function renderGridView() {
            const html = `<div class="channels-grid">${state.channels.map((ch, idx) => `
                <div class="channel-card ${idx === state.currentChannel ? 'active' : ''} ${state.channelStatus[ch.id] || ''}" 
                     onclick="playChannel(${idx})" data-id="${ch.id}">
                    <div class="channel-thumbnail">
                        <i class="fas fa-tv"></i>
                    </div>
                    ${state.channelStatus[ch.id] ? `
                        <div class="status-badge ${state.channelStatus[ch.id]}">
                            <i class="fas fa-${state.channelStatus[ch.id] === 'working' ? 'check' : state.channelStatus[ch.id] === 'broken' ? 'times' : 'spinner fa-spin'}"></i>
                            ${state.channelStatus[ch.id] === 'working' ? 'Online' : state.channelStatus[ch.id] === 'broken' ? 'Offline' : 'Checking'}
                        </div>
                    ` : ''}
                    <div class="channel-info-grid">
                        <div class="channel-name-grid">
                            <i class="fas fa-play-circle" style="color: var(--primary);"></i>
                            ${ch.name}
                        </div>
                        <div class="channel-meta-grid">
                            <span class="meta-tag">
                                <i class="fas fa-folder"></i>
                                ${ch.group}
                            </span>
                            <span class="meta-tag">
                                <i class="fas fa-signal"></i>
                                HD
                            </span>
                        </div>
                    </div>
                    <div class="channel-actions">
                        <button class="action-icon-btn" onclick="event.stopPropagation(); checkChannel(${idx})" title="Test">
                            <i class="fas fa-vial"></i>
                        </button>
                        <button class="action-icon-btn delete" onclick="event.stopPropagation(); deleteChannel(${idx})" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('')}</div>`;

            elements.channelsContainer.innerHTML = html;
        }

        // List View
        function renderListView() {
            const html = `<div class="channels-list">${state.channels.map((ch, idx) => `
                <div class="channel-item-list ${idx === state.currentChannel ? 'active' : ''}" 
                     onclick="playChannel(${idx})" data-id="${ch.id}">
                    <div class="channel-icon-list">
                        <i class="fas fa-tv"></i>
                    </div>
                    <div class="channel-details-list">
                        <div class="channel-name-list">
                            ${ch.name}
                            ${state.channelStatus[ch.id] ? `
                                <span class="status-badge ${state.channelStatus[ch.id]}">
                                    <i class="fas fa-${state.channelStatus[ch.id] === 'working' ? 'check' : state.channelStatus[ch.id] === 'broken' ? 'times' : 'spinner fa-spin'}"></i>
                                    ${state.channelStatus[ch.id] === 'working' ? 'Online' : state.channelStatus[ch.id] === 'broken' ? 'Offline' : 'Checking'}
                                </span>
                            ` : ''}
                        </div>
                        <div class="channel-meta-list">
                            <span><i class="fas fa-folder"></i> ${ch.group}</span>
                            <span><i class="fas fa-signal"></i> HD</span>
                        </div>
                        <div class="channel-url-list">${ch.url.substring(0, 60)}...</div>
                    </div>
                    <button class="btn btn-danger" onclick="event.stopPropagation(); deleteChannel(${idx})" style="margin-left: auto;">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('')}</div>`;

            elements.channelsContainer.innerHTML = html;
        }

        // Play Channel
        function playChannel(index) {
            if (index < 0 || index >= state.channels.length) return;

            state.currentChannel = index;
            const channel = state.channels[index];

            if (state.hls) {
                state.hls.destroy();
            }

            if (channel.url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    state.hls = new Hls();
                    state.hls.loadSource(channel.url);
                    state.hls.attachMedia(elements.videoPlayer);
                    state.hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        elements.videoPlayer.play();
                        elements.streamStatus.textContent = 'Playing';
                    });
                }
            } else {
                elements.videoPlayer.src = channel.url;
                elements.videoPlayer.play();
            }

            renderChannels();
            showToast(`📺 Now Playing: ${channel.name}`, 'success');
        }

        // Delete Channel
        function deleteChannel(index) {
            const channel = state.channels[index];
            
            document.getElementById('modalTitle').textContent = 'Delete Channel';
            document.getElementById('modalBody').textContent = `Are you sure you want to delete "${channel.name}"?`;
            elements.confirmModal.classList.add('active');

            document.getElementById('modalConfirm').onclick = () => {
                state.channels.splice(index, 1);
                if (state.currentChannel === index) {
                    state.currentChannel = -1;
                }
                renderChannels();
                updateStats();
                elements.confirmModal.classList.remove('active');
                showToast('🗑️ Channel deleted', 'warning');
            };
        }

        document.getElementById('modalCancel').addEventListener('click', () => {
            elements.confirmModal.classList.remove('active');
        });

        // Check Single Channel
        async function checkChannel(index) {
            const channel = state.channels[index];
            state.channelStatus[channel.id] = 'checking';
            renderChannels();

            try {
                const response = await fetch(channel.url, { method: 'HEAD', mode: 'no-cors' });
                state.channelStatus[channel.id] = 'working';
                showToast(`✅ ${channel.name} is working`, 'success');
            } catch (error) {
                state.channelStatus[channel.id] = 'broken';
                showToast(`❌ ${channel.name} is broken`, 'error');
            }

            renderChannels();
            updateStats();
        }

        // Scan All Channels
        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (state.scanning) return;
            if (state.channels.length === 0) {
                showToast('No channels to scan', 'warning');
                return;
            }

            state.scanning = true;
            state.channelStatus = {};
            elements.scannerProgress.classList.add('active');
            document.getElementById('scanBtn').innerHTML = '<div class="spinner"></div> Scanning...';

            for (let i = 0; i < state.channels.length; i++) {
                const channel = state.channels[i];
                const progress = ((i + 1) / state.channels.length) * 100;

                elements.progressBarFill.style.width = progress + '%';
                elements.progressText.textContent = `Checking ${i + 1}/${state.channels.length}: ${channel.name}`;
                elements.scanProgress.textContent = Math.round(progress) + '%';

                state.channelStatus[channel.id] = 'checking';
                renderChannels();

                try {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 5000);
                    
                    await fetch(channel.url, { 
                        method: 'HEAD', 
                        mode: 'no-cors',
                        signal: controller.signal 
                    });
                    
                    clearTimeout(timeout);
                    state.channelStatus[channel.id] = 'working';
                } catch (error) {
                    state.channelStatus[channel.id] = 'broken';
                }

                renderChannels();
                updateStats();
                await new Promise(resolve => setTimeout(resolve, 500));
            }

            state.scanning = false;
            elements.scannerProgress.classList.remove('active');
            document.getElementById('scanBtn').innerHTML = '<i class="fas fa-play"></i> Start Scan';
            
            const working = Object.values(state.channelStatus).filter(s => s === 'working').length;
            const broken = Object.values(state.channelStatus).filter(s => s === 'broken').length;
            
            showToast(`✅ Scan complete: ${working} working, ${broken} broken`, 'success');
        });

        // Remove Broken Channels
        document.getElementById('cleanBtn').addEventListener('click', () => {
            const broken = state.channels.filter(ch => state.channelStatus[ch.id] === 'broken');
            
            if (broken.length === 0) {
                showToast('No broken channels to remove', 'warning');
                return;
            }

            document.getElementById('modalTitle').textContent = 'Remove Broken Channels';
            document.getElementById('modalBody').textContent = `Are you sure you want to remove ${broken.length} broken channel(s)?`;
            elements.confirmModal.classList.add('active');

            document.getElementById('modalConfirm').onclick = () => {
                state.channels = state.channels.filter(ch => state.channelStatus[ch.id] !== 'broken');
                state.channelStatus = {};
                renderChannels();
                updateStats();
                elements.confirmModal.classList.remove('active');
                showToast(`🗑️ Removed ${broken.length} broken channels`, 'success');
            };
        });

        // Update Stats
        function updateStats() {
            elements.totalChannels.textContent = state.channels.length;
            
            const working = Object.values(state.channelStatus).filter(s => s === 'working').length;
            const broken = Object.values(state.channelStatus).filter(s => s === 'broken').length;
            
            elements.workingChannels.textContent = working;
            elements.brokenChannels.textContent = broken;
        }

        // Download Playlist
        document.getElementById('downloadM3u').addEventListener('click', () => downloadPlaylist('m3u'));
        document.getElementById('downloadM3u8').addEventListener('click', () => downloadPlaylist('m3u8'));

        function downloadPlaylist(ext) {
            if (state.channels.length === 0) {
                showToast('No channels to download', 'warning');
                return;
            }

            let content = '#EXTM3U\n\n';
            state.channels.forEach(ch => {
                content += `#EXTINF:-1 group-title="${ch.group}",${ch.name}\n${ch.url}\n\n`;
            });

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `magic_iptv_${Date.now()}.${ext}`;
            a.click();
            URL.revokeObjectURL(url);

            showToast(`📥 Playlist downloaded as .${ext}`, 'success');
        }

        // Simulate stats
        setInterval(() => {
            if (!elements.videoPlayer.paused) {
                elements.bitrate.textContent = (Math.random() * 5 + 3).toFixed(1);
                elements.latency.textContent = Math.floor(Math.random() * 30 + 15);
            }
        }, 3000);

        // Initialize
        showToast('✨ Welcome to Magic IPTV Ultimate!', 'success');
    </script>
</body>
</html>
